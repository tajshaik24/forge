# Generate the Xcode project with:  brew install xcodegen && xcodegen
name: FORGE
options:
  bundleIdPrefix: com.taj
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
  # Free (Personal) Apple teams can't sign iCloud or push. This config drops those
  # entitlements and builds with PERSONAL_TEAM: local storage, no Crews.
  Personal: debug
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: "LDUCPMFSMH"
targets:
  FORGE:
    type: application
    platform: iOS
    sources:
      - path: FORGE
      - path: Shared
    dependencies:
      - target: FORGEWatch
      - target: FORGEWidgets
    info:
      path: FORGE/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: FORGE
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [remote-notification]
        CKSharingSupported: true
        ITSAppUsesNonExemptEncryption: false   # only Apple's standard encryption; skips the export compliance question
        NSSupportsLiveActivities: true
        NSHealthShareUsageDescription: "FORGE reads your heart rate, sleep and heart-rate variability to track workouts and adjust today's training volume."
        NSHealthUpdateUsageDescription: "FORGE saves your strength workouts, heart rate and active calories to Apple Health so they appear in Fitness."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taj.forge
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: FORGE/FORGE.entitlements   # HealthKit, iCloud, push, time-sensitive
      configs:
        Personal:
          CODE_SIGN_ENTITLEMENTS: FORGE/FORGE-Personal.entitlements
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) PERSONAL_TEAM

  FORGEWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: FORGEWidgets
      - path: FORGE/Activity/WorkoutActivity.swift
      - path: Shared/Theme.swift
      - path: Shared/WidgetSnapshot.swift
    info:
      path: FORGEWidgets/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: FORGE
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taj.forge.widgets
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: FORGEWidgets/FORGEWidgets.entitlements   # App Group: reads the app's snapshot

  FORGETests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FORGETests
    dependencies:
      - target: FORGE
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taj.forge.tests
        GENERATE_INFOPLIST_FILE: YES

  FORGEWatch:
    type: application
    platform: watchOS
    sources:
      - path: FORGEWatch
      - path: Shared
    dependencies:
      - target: FORGEWatchWidgets
    info:
      path: FORGEWatch/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: FORGE
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.taj.forge
        WKBackgroundModes: [workout-processing]
        NSHealthShareUsageDescription: "FORGE reads your heart rate during workouts."
        NSHealthUpdateUsageDescription: "FORGE saves your strength workouts to Apple Health so they appear in Fitness."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taj.forge.watchkitapp
        CODE_SIGN_ENTITLEMENTS: FORGEWatch/FORGEWatch.entitlements
      configs:
        Personal:
          CODE_SIGN_ENTITLEMENTS: FORGEWatch/FORGEWatch-Personal.entitlements
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) PERSONAL_TEAM

  FORGEWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: FORGEWatchWidgets
      - path: FORGEWidgets/TodayWidget.swift
      - path: Shared/Theme.swift
      - path: Shared/WidgetSnapshot.swift
    info:
      path: FORGEWatchWidgets/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: FORGE
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taj.forge.watchkitapp.widgets
        CODE_SIGN_ENTITLEMENTS: FORGEWatchWidgets/FORGEWatchWidgets.entitlements

schemes:
  FORGE:
    build:
      targets:
        FORGE: all
    test:
      targets:
        - FORGETests
    run:
      config: Debug
  FORGEWatch:
    build:
      targets:
        FORGEWatch: all
    run:
      config: Debug
  FORGE Personal:
    build:
      targets:
        FORGE: all
    run:
      config: Personal
  FORGEWatch Personal:
    build:
      targets:
        FORGEWatch: all
    run:
      config: Personal
